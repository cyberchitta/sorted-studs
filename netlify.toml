[build]
  base = "subsite"
  command = "bun run build"
  publish = "_site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- subsite/ netlify.toml"

[build.environment]
  GIT_LFS_ENABLED = "true"
  GIT_LFS_FETCH_INCLUDE = "*.woff2,*.jpg,*.png,*.jpeg,*.gif,*.tif,*.pdf,*.mp4,*.bmp,*.webp,*.ico,*.glb"

[context.production.environment]
  ELEVENTY_ENV = "production"

[[headers]]
  for = "/assets/exhibits/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
